<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/Noah_gaming_logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>NOAH GAMING | PLAY • CHILL • CONNECT</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#851B2B" />
    <meta name="description" content="NOAH GAMING: PLAY • CHILL • CONNECT. Premium console and tournament lounge bookings, real-time timers, and club memberships." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOAH GAMING" />
    <link rel="apple-touch-icon" href="/icons/Noah_gaming_logo.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Teko:wght@600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Instant Zero-Flash Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('noah_theme');
          var isDark = true;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            // 'system' or not set (system default)
            isDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
          }
          var theme = isDark ? 'dark' : 'light';
          var doc = document.documentElement;
          doc.classList.remove('light', 'dark');
          doc.classList.add(theme);
          doc.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#F5F6FA' : '#851B2B');
          }
        } catch (e) {}
      })();

      // Mobile-only gesture zoom prevention (iOS Safari pinch gesture handling)
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          if ('ontouchstart' in window || (navigator && navigator.maxTouchPoints > 0)) {
            document.addEventListener('gesturestart', function(e) {
              e.preventDefault();
            }, { passive: false });
            document.addEventListener('gesturechange', function(e) {
              e.preventDefault();
            }, { passive: false });
            document.addEventListener('gestureend', function(e) {
              e.preventDefault();
            }, { passive: false });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#171014] text-[#FFF4E8] min-h-screen selection:bg-[#851B2B] selection:text-[#FFF4E8]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
